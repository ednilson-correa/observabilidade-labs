# Três Collectors lendo os MESMOS arquivos, cada um com seu próprio file_storage.
#   col-json       0.163.1 com a gate desligada: último caminho que ainda grava JSON
#   col-proto      0.163.1 no padrão: protobuf (padrão desde a 0.156.0)
#   col-proto-164  0.164.0: protobuf sem opção de desligar

x-collector: &collector
  # Roda como root só porque o volume nomeado nasce com dono root
  user: "0:0"
  depends_on:
    - gerador
  restart: unless-stopped

services:
  gerador:
    build: ./gerador
    environment:
      ARQUIVOS: ${ARQUIVOS:-1000}
      LINHAS_SEG: ${LINHAS_SEG:-200}
      LOG_DIR: /logs
    volumes:
      - logs:/logs
    restart: unless-stopped

  col-json:
    <<: *collector
    image: otel/opentelemetry-collector-contrib:${COLLECTOR_ANTES:-0.163.1}
    command:
      - --config=/etc/otelcol-contrib/config.yaml
      - --feature-gates=-filelog.protobufCheckpointEncoding
    environment:
      INSTANCIA: json-0.163.1
    volumes:
      - ./otel-collector.yaml:/etc/otelcol-contrib/config.yaml:ro
      - logs:/logs:ro
      - storage-json:/var/lib/otelcol/file_storage

  col-proto:
    <<: *collector
    image: otel/opentelemetry-collector-contrib:${COLLECTOR_ANTES:-0.163.1}
    environment:
      INSTANCIA: protobuf-0.163.1
    volumes:
      - ./otel-collector.yaml:/etc/otelcol-contrib/config.yaml:ro
      - logs:/logs:ro
      - storage-proto:/var/lib/otelcol/file_storage

  col-proto-164:
    <<: *collector
    image: otel/opentelemetry-collector-contrib:${COLLECTOR_DEPOIS:-0.164.0}
    environment:
      INSTANCIA: protobuf-0.164.0
    volumes:
      - ./otel-collector.yaml:/etc/otelcol-contrib/config.yaml:ro
      - logs:/logs:ro
      - storage-proto-164:/var/lib/otelcol/file_storage

  prometheus:
    image: prom/prometheus:${PROMETHEUS_VERSAO:-v3.15.1}
    volumes:
      - ./prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
    ports:
      - "${PROMETHEUS_PORTA:-9090}:9090"

  grafana:
    image: grafana/grafana:${GRAFANA_VERSAO:-13.3.0}
    environment:
      GF_AUTH_ANONYMOUS_ENABLED: "true"
      GF_AUTH_ANONYMOUS_ORG_ROLE: Admin
      GF_AUTH_DISABLE_LOGIN_FORM: "true"
      GF_USERS_DEFAULT_THEME: dark
      GF_DASHBOARDS_DEFAULT_HOME_DASHBOARD_PATH: /var/lib/grafana/dashboards/lab-filelog-checkpoint.json
    volumes:
      - ./grafana/provisioning:/etc/grafana/provisioning:ro
      - ./grafana/dashboards:/var/lib/grafana/dashboards:ro
    ports:
      - "${GRAFANA_PORTA:-3000}:3000"
    depends_on:
      - prometheus

  # Inspeciona os checkpoints gravados. Rode: docker compose run --rm inspecao
  inspecao:
    image: python:3.13.9-slim
    profiles: ["ferramentas"]
    command: >
      sh -c "for i in json proto proto-164; do cp /st/$$i/receiver_filelog_ /tmp/$$i;
      python /scripts/checkpoint.py /tmp/$$i; done"
    volumes:
      - ./scripts:/scripts:ro
      - storage-json:/st/json:ro
      - storage-proto:/st/proto:ro
      - storage-proto-164:/st/proto-164:ro

volumes:
  logs:
  storage-json:
  storage-proto:
  storage-proto-164:
