global:
  scrape_interval: 15s
  evaluation_interval: 15s

# Métricas do span_metrics chegam via OTLP (flag --web.enable-otlp-receiver).
otlp:
  translation_strategy: UnderscoreEscapingWithSuffixes

storage:
  tsdb:
    out_of_order_time_window: 30m

scrape_configs:
  - job_name: prometheus
    static_configs:
      - targets: ["localhost:9090"]

  # Métricas internas do Collector: quantos spans entram x quantos saem
  # depois do probabilistic_sampler.
  - job_name: otel-collector
    static_configs:
      - targets: ["otel-collector:8888"]

  # Métricas internas do Tempo.
  - job_name: tempo
    static_configs:
      - targets: ["tempo:3200"]
