receivers:
  otlp:
    protocols:
      grpc:
        endpoint: 0.0.0.0:4317
      http:
        endpoint: 0.0.0.0:4318

connectors:
  # "Verdade" do lab: RED metrics calculadas sobre 100% dos spans, ANTES da
  # amostragem. Servem de referência para conferir a extrapolação do Tempo.
  # (o tipo antigo "spanmetrics" foi renomeado para "span_metrics")
  span_metrics:
    namespace: traces.span.metrics
    metrics_flush_interval: 15s

processors:
  memory_limiter:
    check_interval: 1s
    limit_percentage: 80
    spike_limit_percentage: 20

  # Amostragem de cabeça no Collector: fica 1 trace a cada 4 (25%).
  # IMPORTANTE: o modo padrão é "hash_seed". Com "proportional" o processor
  # segue a especificação de amostragem do OpenTelemetry (56 bits de
  # aleatoriedade do trace ID) e grava o limiar no tracestate de cada span:
  #   tracestate: ot=th:c   (th:c = 25%)
  # É essa informação que o Tempo 3.1 usa no with(extrapolate=true).
  probabilistic_sampler:
    mode: proportional
    sampling_percentage: ${env:SAMPLING_PERCENTAGE}

  batch:
    timeout: 2s

exporters:
  otlp_grpc/tempo:
    endpoint: tempo:4317
    tls:
      insecure: true

  # Métricas do span_metrics -> receptor OTLP nativo do Prometheus
  otlp_http/prometheus:
    endpoint: http://prometheus:9090/api/v1/otlp

  debug:
    verbosity: basic

service:
  pipelines:
    # 1) 100% dos spans -> span_metrics (referência)
    traces/total:
      receivers: [otlp]
      processors: [memory_limiter]
      exporters: [span_metrics]

    # 2) Spans amostrados (25%) -> Tempo
    traces/amostrado:
      receivers: [otlp]
      processors: [memory_limiter, probabilistic_sampler, batch]
      exporters: [otlp_grpc/tempo]

    metrics:
      receivers: [span_metrics]
      processors: [memory_limiter, batch]
      exporters: [otlp_http/prometheus]

  telemetry:
    logs:
      level: info
    metrics:
      level: normal
      readers:
        - pull:
            exporter:
              prometheus:
                host: 0.0.0.0
                port: 8888
