# Tempo 3.1 em modo monolítico (-target=all): todos os componentes em um
# processo, sem Kafka. Não copie blocos de microsserviços (ingest,
# block_builder, live_store_client...) para cá.
stream_over_http_enabled: true

server:
  http_listen_port: 3200
  log_level: info

distributor:
  receivers:
    otlp:
      protocols:
        grpc:
          endpoint: 0.0.0.0:4317

storage:
  trace:
    backend: local
    wal:
      path: /var/tempo/wal
    local:
      path: /var/tempo/blocks

usage_report:
  reporting_enabled: false
