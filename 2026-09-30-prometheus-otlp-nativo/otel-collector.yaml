receivers:
  otlp:
    protocols:
      grpc:
        endpoint: 0.0.0.0:4317
      http:
        endpoint: 0.0.0.0:4318

processors:
  memory_limiter:
    check_interval: 1s
    limit_percentage: 80
    spike_limit_percentage: 20

  # O Prometheus armazena contadores e histogramas cumulativos.
  # Métricas com temporalidade delta (ex.: SDKs configurados para delta,
  # como o serviço "checkout" do lab) são convertidas aqui.
  delta_to_cumulative:
    max_stale: 5m

  batch:
    timeout: 5s

exporters:
  # Envia direto para o receptor OTLP nativo do Prometheus.
  # O exporter acrescenta /v1/metrics ao endpoint:
  #   http://prometheus:9090/api/v1/otlp/v1/metrics
  otlp_http/prometheus:
    endpoint: http://prometheus:9090/api/v1/otlp

  debug:
    verbosity: basic

service:
  pipelines:
    metrics:
      receivers: [otlp]
      processors: [memory_limiter, delta_to_cumulative, batch]
      exporters: [otlp_http/prometheus, debug]

  telemetry:
    logs:
      level: info
    metrics:
      level: normal
      readers:
        - pull:
            exporter:
              prometheus:
                host: 0.0.0.0
                port: 8888
